name: Extract website ZIP
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract uploaded template
        run: |
          set -euo pipefail
          ZIP="digital-agency-multipage-template-main.zip"
          test -f "$ZIP"
          mkdir -p .extract-temp
          unzip -oq "$ZIP" -d .extract-temp
          SOURCE=".extract-temp/digital-agency-multipage-template-main"
          test -f "$SOURCE/package.json"
          cp -a "$SOURCE/." .
          rm -rf .extract-temp
          rm -f "$ZIP"
      - name: Commit extracted files
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Extract website template"
          git push
