name: Replace site with HUSBA DIGITAL template
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/replace-crafex.yml'
      - 'replace-crafex.trigger'
permissions:
  contents: write
jobs:
  replace:
    if: ${{ !contains(github.event.head_commit.message, '[replacement-done]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Download, customize, and test template
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/LilProff/crafex-portfolio/archive/refs/heads/main.zip -o /tmp/crafex.zip
          mkdir -p /tmp/crafex-source
          unzip -q /tmp/crafex.zip -d /tmp/crafex-source
          SOURCE="$(find /tmp/crafex-source -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          test -f "$SOURCE/package.json"
          python3 scripts/brand-crafex-template.py "$SOURCE"
          cd "$SOURCE"
          npm ci
          npm run build
      - name: Replace tracked old template files
        shell: bash
        run: |
          set -euo pipefail
          SOURCE="$(find /tmp/crafex-source -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          git rm -r --ignore-unmatch src public index.html package.json package-lock.json postcss.config.cjs postcss.config.js tailwind.config.cjs tailwind.config.js tsconfig.json tsconfig.node.json vite.config.ts components.json .eslintrc.cjs .gitignore .npmrc README.md PROJECT.md netlify.toml
          cp -a "$SOURCE/." .
          rm -f .github/workflows/extract-template.yml
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Replace old site with HUSBA DIGITAL premium template [replacement-done]'
          git push origin main
